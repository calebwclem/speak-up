<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speak Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header>
    <h1>Speak Up</h1>
    <p class="tagline">Rehearse the hard conversation before it counts.</p>
  </header>

  <div id="setup-screen">
    <label for="scenario-input">What do you want to practice?</label>
    <div class="input-with-mic">
      <input
        id="scenario-input"
        type="text"
        placeholder="e.g. public comment on a local housing proposal"
        autocomplete="off"
        enterkeyhint="go"
      >
      <button id="setup-mic-btn" aria-label="Say what you want to practise" title="Say what you want to practise">🎤</button>
    </div>
    <p id="setup-voice-status" class="voice-status hidden" role="status"></p>
    <button id="start-btn">Start Practice Round</button>
    <p class="hint">We'll find a real, current local issue related to your topic.</p>
  </div>

  <div id="chat-screen" class="hidden">
    <div id="messages" role="log" aria-live="polite" aria-label="Practice conversation"></div>

    <div id="input-row">
      <input
        id="message-input"
        type="text"
        placeholder="Make your point..."
        autocomplete="off"
        enterkeyhint="send"
        aria-label="Your point"
      >
      <button id="mic-btn" aria-label="Speak your point" title="Speak your point">🎤</button>
      <button id="send-btn">Send</button>
    </div>

    <p id="voice-status" class="voice-status hidden" role="status"></p>

    <button id="coach-btn">Get Coaching Feedback</button>
    <button id="speak-toggle-btn" aria-pressed="true">🔊 Reading replies aloud</button>
    <button id="new-round-btn">New Scenario</button>
  </div>

  <div id="loading" class="hidden" role="status">
    <p>Thinking...</p>
  </div>

</div>

<!-- config.js is gitignored and must load first — it defines window.GEMINI_CONFIG -->
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
